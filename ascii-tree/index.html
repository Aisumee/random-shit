<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ASCII Christmas Tree</title>
<meta name="description" content="A rotating 3D Christmas tree made of thousands of ASCII letters." />
<meta property="og:title" content="ASCII Christmas Tree" />
<meta property="og:description" content="A rotating 3D Christmas tree made of thousands of ASCII letters." />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#04060b" />
<style>
  :root { --bg: #04060b; --panel: #0b0d12; --line: #1a1e27; --dim: #6b7385; --text: #c9d1e0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, "Courier New", monospace; }
  .app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  .scene { position: relative; flex: 1; min-height: 0; cursor: pointer; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: absolute; left: 12px; bottom: 10px; font-size: 11px; line-height: 1.6; color: #9aa3b5;
    pointer-events: none; white-space: pre; }
  .clock { position: absolute; right: 12px; top: 10px; font-size: 11px; color: #ff6b6b; pointer-events: none; }
</style>
</head>
<body>
<div class="app">
  <div class="scene" id="scene" title="Tap to restart">
    <canvas id="c" aria-label="A rotating 3D Christmas tree made of ASCII letters"></canvas>
    <div class="clock" id="clock">t 00.00s</div>
    <div class="hud" id="hud"></div>
  </div>
</div>
<script>
(() => {
  // ---------- seeded random ----------
  let seed = 2026;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const gauss = () => Math.sqrt(-2 * Math.log(rnd() + 1e-9)) * Math.cos(2 * Math.PI * rnd());
  const LETTERS = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ#%&@$*+";
  const letter = () => LETTERS[(rnd() * LETTERS.length) | 0];

  // ---------- the model (same as tree.py) ----------
  const Y0 = 0.45, Y1 = 2.75, TIERS = 5, N_LEAF = 30000, N_LIGHTS = 170, N_BALLS = 26;
  const LEAF = 0, TRUNK = 1, GARLAND = 2, BALL = 3, GIFT = 4, SKIRT = 5, LIGHT = 6;
  const GROW = 5.0, GARLANDS = 4.5, BALLS = 5.5, LIGHTS = 5.0, STAR = 8.5, GIFTS = 8.8;
  const envelope = y => { const f = Math.min(1, Math.max(0, (y - Y0) / (Y1 - Y0))), tier = (f * TIERS) % 1;
    return (0.03 + 1.02 * Math.pow(1 - f, 0.95)) * (0.86 + 0.16 * (1 - tier)); };

  const X = [], Y = [], Z = [], CR = [], CG = [], CB = [], CHR = [], KIND = [], KEY = [];
  const add = (x, y, z, c, ch, kind, key) => { X.push(x); Y.push(y); Z.push(z); CR.push(c[0]); CG.push(c[1]); CB.push(c[2]);
    CHR.push(ch); KIND.push(kind); KEY.push(key); };
  const onRing = (y, a, g) => { const r = envelope(y) * g; return [r * Math.cos(a), y, r * Math.sin(a)]; };

  for (let i = 0; i < N_LEAF; i++) {             // foliage
    const y = Y0 + rnd() * (Y1 - Y0), d = Math.pow(rnd(), 0.3), [x, , z] = onRing(y, rnd() * 6.2832, d);
    add(x, y, z, [0.07 + 0.12 * rnd(), 0.30 + 0.32 * rnd(), 0.13 + 0.13 * rnd()], letter(), LEAF, y);
  }
  for (let i = 0; i < 600; i++) {                // trunk
    const a = rnd() * 6.2832, y = rnd() * (Y0 + 0.1);
    add(0.12 * Math.cos(a), y, 0.12 * Math.sin(a), [0.42, 0.26, 0.13], letter(), TRUNK, y);
  }
  for (let k = 0; k < 3; k++) {                  // gold garlands, top down
    for (let i = 0; i < 2000; i++) {
      const s = i / 2000, y = Y1 - 0.25 - s * (Y1 - Y0 - 0.35) + gauss() * 0.022;
      const [x, , z] = onRing(y, s * 3.2 * 6.2832 + k * 2.1, 1.03);
      add(x, y, z, [1.0, 0.78, 0.30], letter(), GARLAND, s);
    }
  }
  for (let b = 0; b < N_BALLS; b++) {            // baubles
    const y = Y0 + 0.15 + rnd() * (Y1 - 0.4 - Y0 - 0.15), c = onRing(y, rnd() * 6.2832, 1.02);
    const base = rnd() < 0.3 ? [1.0, 0.72, 0.2] : [0.86, 0.07, 0.11];
    for (let i = 0; i < 70; i++) {
      let nx = gauss(), ny = gauss(), nz = gauss(); const L = Math.hypot(nx, ny, nz); nx /= L; ny /= L; nz /= L;
      const lit = 0.45 + 0.75 * Math.max(0, Math.min(1, -0.4 * nx + 0.6 * ny - 0.7 * nz));
      add(c[0] + 0.075 * nx, c[1] + 0.075 * ny, c[2] + 0.075 * nz, base.map(v => v * lit), "@O0Q8%"[(rnd() * 6) | 0], BALL, b);
    }
  }
  const WARM = [[1, .85, .45], [1, 1, .9], [1, .55, .2]];
  for (let i = 0; i < N_LIGHTS; i++) {           // fairy lights
    const y = Y0 + 0.05 + rnd() * (Y1 - 0.15 - Y0 - 0.05), [x, , z] = onRing(y, rnd() * 6.2832, 1.04);
    const r = rnd(); add(x, y, z, WARM[r < 0.6 ? 0 : r < 0.9 ? 1 : 2], "o", LIGHT, i);
  }
  for (const [gx, gz, w, h, dp, col] of [[-0.90, 0.35, .34, .34, .32, [.8, .06, .1]], [0.95, 0.05, .38, .28, .32, [.1, .25, .85]],
                                         [-0.25, 0.95, .30, .24, .30, [.8, .06, .1]], [0.60, 0.80, .26, .34, .26, [.1, .25, .85]]]) {
    for (let i = 0; i < 2600; i++) {             // presents
      const u = [rnd() - 0.5, rnd() - 0.5, rnd() - 0.5]; u[(rnd() * 3) | 0] = rnd() < 0.5 ? -0.5 : 0.5;
      const ribbon = Math.abs(u[0]) < 0.07 || Math.abs(u[2]) < 0.07;
      add(gx + u[0] * w, (u[1] + 0.5) * h, gz + u[2] * dp, ribbon ? [1, .8, .3] : col, letter(), GIFT, 0);
    }
  }
  for (let i = 0; i < 4000; i++) {               // tree skirt
    const r = Math.sqrt(0.0225 + rnd() * (1.3225 - 0.0225)), a = rnd() * 6.2832;
    add(r * Math.cos(a), 0.015, r * Math.sin(a), [0.80 + 0.12 * rnd(), 0.72 + 0.1 * rnd(), 0.56 + 0.1 * rnd()], letter(), SKIRT, 0);
  }
  const N = X.length;

  // ---------- canvas / grid ----------
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const hud = document.getElementById("hud"), clock = document.getElementById("clock");
  const CW = 4, CH = 6.4, AX = CH / CW, TILT = 0.28, CT = Math.cos(TILT), ST = Math.sin(TILT);
  let cols, rows, dpr, scale, depth, owner, stars, groundCell, groundShade;
  let PX = 0, PY = 0, PZ = 0;
  function project(x, y, z, ca, sa) {
    const xr = x * ca - z * sa, zr = x * sa + z * ca, y0 = y - 1.3;
    const yy = y0 * CT + zr * ST, zz = zr * CT - y0 * ST, k = 4.6 / (4.6 + zz);
    PX = Math.floor(cols / 2 + xr * k * scale * AX); PY = Math.floor(rows * 0.53 - yy * k * scale); PZ = zz;
  }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    cols = Math.floor(w / CW); rows = Math.floor(h / CH);
    scale = Math.min(rows / 4.4, cols / (AX * 3.7));
    depth = new Float32Array(cols * rows); owner = new Int32Array(cols * rows);
    let s = 99; const r2 = () => (s = (s * 16807) % 2147483647) / 2147483647;
    stars = Array.from({ length: Math.floor(cols * rows / 45) }, () =>
      ({ x: r2() * cols | 0, y: r2() * rows * 0.75 | 0, p: r2() * 6.28, b: r2() < 0.1 }));
    // the ground doesn't rotate, so project it once
    groundCell = new Map();
    for (let gx = -5; gx < 5; gx += 0.07) for (let gz = -3.0; gz < 1.1; gz += 0.07) {
      project(gx, 0, gz, 1, 0);
      if (PX < 0 || PX >= cols || PY < 0 || PY >= rows) continue;
      const cell = PY * cols + PX, fade = Math.pow(Math.max(0, 1 - Math.hypot(gx, gz + 0.3) / 5), 1.5) * 0.9;
      const prev = groundCell.get(cell);
      if (!prev || PZ + 0.02 < prev[0]) groundCell.set(cell, [PZ + 0.02, fade]);
    }
  }
  window.addEventListener("resize", resize);
  resize();

  let start = performance.now();
  document.getElementById("scene").addEventListener("click", () => { start = performance.now(); });

  function draw(now) {
    const t = (now - start) / 1000, angle = t * 0.32, ca = Math.cos(angle), sa = Math.sin(angle);
    const growY = -0.1 + (Y1 + 0.45) * Math.min(1, t / GROW);
    const nGarl = (t - GARLANDS) / 3, nBall = (t - BALLS) * 5, nLight = (t - LIGHTS) * 36, gifts = t > GIFTS;
    const W = cv.width, H = cv.height;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#03050a"); g.addColorStop(0.6, "#080c18"); g.addColorStop(1, "#04060b");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = `bold ${CH + 0.6}px ui-monospace, Menlo, Consolas, monospace`;
    ctx.textBaseline = "top";

    for (const s of stars) {
      const a = 0.3 + 0.35 * Math.sin(t * 1.6 + s.p);
      ctx.fillStyle = `rgba(220,230,255,${s.b ? Math.min(1, a + 0.45) : a})`;
      ctx.fillText(s.b ? "*" : ".", s.x * CW, s.y * CH - 2);
    }

    depth.fill(1e9); owner.fill(-1);
    for (const [cell, [z]] of groundCell) { depth[cell] = z; owner[cell] = -2; }
    let lit = 0;
    for (let i = 0; i < N; i++) {
      const k = KIND[i], key = KEY[i];
      if (k === LEAF || k === TRUNK) { if (Y[i] >= growY) continue; }
      else if (k === GARLAND) { if (key >= nGarl) continue; }
      else if (k === BALL) { if (key >= nBall) continue; }
      else if (k === LIGHT) { if (key >= nLight) continue; lit++; }
      else if (!gifts) continue;
      project(X[i], Y[i], Z[i], ca, sa);
      if (PX < 0 || PX >= cols || PY < 0 || PY >= rows) continue;
      const cell = PY * cols + PX;
      if (PZ < depth[cell]) { depth[cell] = PZ; owner[cell] = i; }
    }

    let letters = 0;
    const glows = [];
    for (let cell = 0; cell < owner.length; cell++) {
      const i = owner[cell]; if (i === -1) continue;
      let r, gg, b, ch;
      if (i === -2) { const f = groundCell.get(cell)[1]; r = f * 0.8; gg = f * 0.85; b = f; ch = "-"; }
      else {
        letters++;
        r = CR[i]; gg = CG[i]; b = CB[i]; ch = CHR[i];
        const k = KIND[i];
        if (k === LEAF) {   // fresh growth is frosted white, so it looks snow-capped while it grows
          const f = Math.max(0, Math.min(1, 1 - (growY - Y[i]) / 0.35));
          r = r * (1 - f) + 0.95 * f; gg = gg * (1 - f) + 0.95 * f; b = b * (1 - f) + 0.95 * f;
        }
        let sh = Math.max(0.3, Math.min(1.15, 1.15 - 0.42 * (depth[cell] + 1)));
        if (k === LIGHT) {
          sh = Math.max(0.75, sh) * (0.65 + 0.35 * Math.sin(t * 3 + KEY[i] * 2.3)) * 1.25;
          glows.push(cell, r, gg, b, sh);
        }
        r *= sh; gg *= sh; b *= sh;
      }
      ctx.fillStyle = `rgb(${Math.min(255, r * 255) | 0},${Math.min(255, gg * 255) | 0},${Math.min(255, b * 255) | 0})`;
      ctx.fillText(ch, (cell % cols) * CW, ((cell / cols) | 0) * CH);
    }

    ctx.globalCompositeOperation = "lighter";
    for (let j = 0; j < glows.length; j += 5) {
      const cell = glows[j], x = (cell % cols) * CW + CW / 2, y = ((cell / cols) | 0) * CH + CH / 2, a = 0.35 * glows[j + 4];
      const rg = ctx.createRadialGradient(x, y, 0, x, y, 8);
      rg.addColorStop(0, `rgba(${glows[j + 1] * 255 | 0},${glows[j + 2] * 255 | 0},${glows[j + 3] * 255 | 0},${a})`);
      rg.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = rg; ctx.fillRect(x - 8, y - 8, 16, 16);
    }
    if (t > STAR) drawStar(t, angle, ca, sa);
    ctx.globalCompositeOperation = "source-over";
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    const deg = ((angle * 180 / Math.PI) % 360).toFixed(2).padStart(6, "0");
    hud.textContent = `ascii tree · 2026\nrotation ${deg}°     lights ${String(lit).padStart(4)}\nletters ${letters.toLocaleString("en-US")}`;
    clock.textContent = `t ${t.toFixed(2).padStart(5, "0")}s`;
  }

  function drawStar(t, angle, ca, sa) {
    project(0, Y1 + 0.12, 0, ca, sa);
    const tx = PX, ty = PY, grow = Math.min(1, (t - STAR) / 0.8);
    const cx = tx * CW + CW / 2, cy = ty * CH + CH / 2, R = 26 + 4 * Math.sin(t * 3);
    const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * grow);
    rg.addColorStop(0, "rgba(255,220,120,0.55)"); rg.addColorStop(1, "rgba(255,180,0,0)");
    ctx.fillStyle = rg; ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
    for (let i = 0; i < 12; i++) {                 // rays
      const a = i * Math.PI / 6 + t * 0.15, ch = "-/|\\"[Math.round((((a % Math.PI) + Math.PI) % Math.PI) / (Math.PI / 4)) % 4];
      const len = (i % 2 ? 6 : 12) * grow;
      for (let d = 3; d < len; d += 0.7) {
        const x = Math.floor(tx + Math.cos(a) * d * AX), y = Math.floor(ty - Math.sin(a) * d), f = 1 - d / 16;
        ctx.fillStyle = `rgba(255,205,90,${f})`; ctx.fillText(ch, x * CW, y * CH);
      }
    }
    for (let dy = -2; dy <= 2; dy++) for (let dx = -4; dx <= 4; dx++) {   // the star itself
      if (Math.abs(dx) / AX + Math.abs(dy) > 2.3 * grow) continue;
      ctx.fillStyle = Math.abs(dx) + Math.abs(dy) < 2 ? "#fff6c8" : "#ffcf55";
      ctx.fillText("#", (tx + dx) * CW, (ty + dy) * CH);
    }
  }

  function loop(now) { draw(now); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

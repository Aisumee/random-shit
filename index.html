<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Random Stuff</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #04060b; color: #c9d1e0;
    font-family: ui-monospace, Menlo, Consolas, monospace; }
  main { padding: 24px 16px; max-width: 480px; width: 100%; box-sizing: border-box; }
  h1 { font-size: 18px; color: #6b7385; font-weight: 500; margin: 0 0 20px; }
  a { display: block; padding: 14px 16px; border: 1px solid #1a1e27; border-radius: 8px; color: #c9d1e0;
    text-decoration: none; background: #0b0d12; }
  a:hover { border-color: #2fd16a; }
  a span { display: block; color: #6b7385; font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>~/random-shit</h1>
  <a href="ascii-tree/">ASCII Christmas Tree<span>a rotating 3D tree made of letters</span></a>
</main>
</body>
</html>
